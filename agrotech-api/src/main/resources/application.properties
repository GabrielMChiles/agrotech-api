spring.application.name=agrotech-api
server.port=8080
server.error.include-stacktrace=never

# DATA SOURCE (POSTGRESQL)
# Uso de variaveis de ambiente com valores padrao (fallback) para ambiente local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agrotech-db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# CORS (origens separadas por virgula)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# JPA / HIBERNATE CONFIG
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Desativa Open Session in View (OSIV) para evitar vazamento de conexoes na camada Web
spring.jpa.open-in-view=false

# POOL DE CONEXOES (HIKARICP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
